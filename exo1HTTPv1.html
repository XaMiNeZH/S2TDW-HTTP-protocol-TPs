<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Client HTTP minimaliste</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f5f5;
      color: #111;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      background: #fff;
      padding: 22px;
      border: 1px solid #ddd;
      border-radius: 10px;
    }

    .row {
      display: flex;
      gap: 16px;
      margin-bottom: 16px;
      align-items: stretch;
    }

    select,
    input,
    textarea,
    button {
      border: 2px solid #444;
      border-radius: 16px;
      padding: 14px 18px;
      font-size: 16px;
      outline: none;
      background: #fff;
    }

    select {
      width: 140px;
      min-width: 140px;
      cursor: pointer;
    }

    .url-input {
      flex: 1;
    }

    .send-btn {
      width: 140px;
      min-width: 140px;
      cursor: pointer;
      background: #fff;
      transition: 0.2s;
    }

    .send-btn:hover {
      background: #f0f0f0;
    }

    .header-key,
    .header-value {
      flex: 1;
    }

    .add-btn {
      width: 70px;
      min-width: 70px;
      font-size: 28px;
      cursor: pointer;
      line-height: 1;
      background: #fff;
    }

    .add-btn:hover {
      background: #f0f0f0;
    }

    textarea {
      width: 100%;
      resize: vertical;
      min-height: 220px;
    }

    .response-box {
      min-height: 220px;
      white-space: pre-wrap;
      overflow-wrap: break-word;
      background: #fff;
    }

    hr {
      margin: 20px 0;
      border: none;
      border-top: 2px solid #999;
    }

    .status-box {
      margin-bottom: 16px;
      padding: 12px 16px;
      border: 2px solid #444;
      border-radius: 12px;
      background: #fafafa;
      font-weight: bold;
    }

    .headers-box {
      width: 100%;
      min-height: 120px;
      margin-bottom: 16px;
      white-space: pre-wrap;
      overflow-wrap: break-word;
      background: #fff;
    }

    .label {
      display: block;
      margin-bottom: 8px;
      font-size: 15px;
      font-weight: bold;
    }

    .header-row.dynamic-header {
      display: flex;
      gap: 16px;
      margin-bottom: 12px;
    }

    .remove-btn {
      width: 70px;
      min-width: 70px;
      font-size: 22px;
      cursor: pointer;
      border: 2px solid #444;
      border-radius: 16px;
      background: #fff;
    }

    .remove-btn:hover {
      background: #f0f0f0;
    }

    @media (max-width: 768px) {
      .row,
      .header-row.dynamic-header {
        flex-direction: column;
      }

      select,
      .send-btn,
      .add-btn,
      .remove-btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Ligne 1 -->
    <div class="row">
      <select id="method">
        <option value="GET">GET</option>
        <option value="POST">POST</option>
        <option value="PUT">PUT</option>
        <option value="PATCH">PATCH</option>
        <option value="DELETE">DELETE</option>
      </select>

      <input
        type="text"
        id="url"
        class="url-input"
        placeholder="URL"
      />

      <button class="send-btn" id="sendBtn">Envoyer</button>
    </div>

    <!-- Headers -->
    <div id="headersContainer">
      <div class="row header-row">
        <input type="text" class="header-key" placeholder="Header key" />
        <input type="text" class="header-value" placeholder="Header value" />
        <button class="add-btn" id="addHeaderBtn">+</button>
      </div>
    </div>

    <!-- Body -->
    <textarea id="body" placeholder="Body"></textarea>

    <hr />

    <!-- Réponse -->
    <div class="status-box" id="statusBox">Status : ---</div>

    <label class="label" for="responseHeaders">Headers</label>
    <textarea id="responseHeaders" class="headers-box" readonly></textarea>

    <label class="label" for="responseBody">Response body</label>
    <textarea id="responseBody" class="response-box" readonly></textarea>
  </div>

  <script>
    const headersContainer = document.getElementById("headersContainer");
    const addHeaderBtn = document.getElementById("addHeaderBtn");
    const sendBtn = document.getElementById("sendBtn");
    const methodSelect = document.getElementById("method");
    const urlInput = document.getElementById("url");
    const bodyInput = document.getElementById("body");
    const statusBox = document.getElementById("statusBox");
    const responseHeaders = document.getElementById("responseHeaders");
    const responseBody = document.getElementById("responseBody");

    function createHeaderRow() {
      const row = document.createElement("div");
      row.className = "header-row dynamic-header";

      row.innerHTML = `
        <input type="text" class="header-key" placeholder="Header key" />
        <input type="text" class="header-value" placeholder="Header value" />
        <button class="remove-btn" type="button">×</button>
      `;

      const removeBtn = row.querySelector(".remove-btn");
      removeBtn.addEventListener("click", () => {
        row.remove();
      });

      headersContainer.appendChild(row);
    }

    addHeaderBtn.addEventListener("click", createHeaderRow);

    function getHeadersObject() {
      const headerRows = headersContainer.querySelectorAll(".header-row");
      const headers = {};

      headerRows.forEach((row) => {
        const key = row.querySelector(".header-key")?.value.trim();
        const value = row.querySelector(".header-value")?.value.trim();

        if (key) {
          headers[key] = value;
        }
      });

      return headers;
    }

    function formatHeaders(headers) {
      let result = "";
      headers.forEach((value, key) => {
        result += `${key}: ${value}\n`;
      });
      return result;
    }

    sendBtn.addEventListener("click", async () => {
      const method = methodSelect.value;
      const url = urlInput.value.trim();
      const body = bodyInput.value.trim();
      const headers = getHeadersObject();

      if (!url) {
        alert("Veuillez saisir une URL.");
        return;
      }

      statusBox.textContent = "Status : Chargement...";
      responseHeaders.value = "";
      responseBody.value = "";

      const options = {
        method,
        headers
      };

      // On n'envoie le body que si la méthode le permet
      if (method !== "GET" && method !== "DELETE" && body) {
        options.body = body;
      }

      try {
        const response = await fetch(url, options);

        statusBox.textContent = `Status : ${response.status} ${response.statusText}`;
        responseHeaders.value = formatHeaders(response.headers);

        const contentType = response.headers.get("content-type") || "";

        if (contentType.includes("application/json")) {
          const data = await response.json();
          responseBody.value = JSON.stringify(data, null, 2);
        } else {
          const text = await response.text();
          responseBody.value = text;
        }
      } catch (error) {
        statusBox.textContent = "Status : Erreur";
        responseHeaders.value = "";
        responseBody.value = "Impossible d'envoyer la requête.\n\n" + error.message;
      }
    });
  </script>
</body>
</html>
